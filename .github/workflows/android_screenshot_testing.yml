name: Android Screenshot Testing

on:
  pull_request:
    branches: [main]
    paths: 
      - 'android/**'
      - '.github/workflows/android_screenshot_testing.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshot-tests:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate screenshots with Roborazzi
        run: ./gradlew :app:recordRoborazziDebug --stacktrace
        continue-on-error: true

      - name: List generated screenshots
        id: list-screenshots
        run: |
          echo "Finding screenshots..."
          find app/build/outputs/roborazzi -type f -name "*.png" || echo "No screenshots found"
          
      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roborazzi-screenshots-${{ github.event.pull_request.number }}
          path: android/app/build/outputs/roborazzi/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare screenshot report
        id: prepare-report
        if: always()
        run: |
          SCREENSHOT_DIR="app/build/outputs/roborazzi"
          
          if [ ! -d "$SCREENSHOT_DIR" ]; then
            echo "No screenshots directory found"
            echo "has_screenshots=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          SCREENSHOT_COUNT=$(find "$SCREENSHOT_DIR" -type f -name "*.png" | wc -l)
          echo "screenshot_count=$SCREENSHOT_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$SCREENSHOT_COUNT" -eq 0 ]; then
            echo "has_screenshots=false" >> $GITHUB_OUTPUT
          else
            echo "has_screenshots=true" >> $GITHUB_OUTPUT
            
            # Create a list of screenshots
            echo "## 📸 Generated Screenshots ($SCREENSHOT_COUNT)" > /tmp/screenshot_report.md
            echo "" >> /tmp/screenshot_report.md
            echo "Screenshots have been generated for this PR. You can download them from the artifacts section above." >> /tmp/screenshot_report.md
            echo "" >> /tmp/screenshot_report.md
            echo "### Screenshot Files:" >> /tmp/screenshot_report.md
            
            find "$SCREENSHOT_DIR" -type f -name "*.png" | while read screenshot; do
              filename=$(basename "$screenshot")
              echo "- \`$filename\`" >> /tmp/screenshot_report.md
            done
          fi

      - name: Comment PR with screenshot info
        if: always() && steps.prepare-report.outputs.has_screenshots == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = '/tmp/screenshot_report.md';
            
            let body = '## 🤖 Screenshot Test Results\n\n';
            
            if (fs.existsSync(reportPath)) {
              body += fs.readFileSync(reportPath, 'utf8');
            } else {
              body += '✅ Screenshot tests completed. Check the artifacts for generated screenshots.';
            }
            
            body += '\n\n---\n';
            body += `📦 [Download Screenshots Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            body += '\n**How to view screenshots:**\n';
            body += '1. Click the link above to go to the workflow run\n';
            body += '2. Scroll to the "Artifacts" section at the bottom\n';
            body += '3. Download the `roborazzi-screenshots` artifact\n';
            body += '4. Extract and view the PNG files\n';
            
            // Find existing bot comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('🤖 Screenshot Test Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Comment on no screenshots
        if: always() && steps.prepare-report.outputs.has_screenshots == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = '## 🤖 Screenshot Test Results\n\n' +
              '⚠️ No screenshots were generated. This might be because:\n' +
              '- No screenshot tests exist yet\n' +
              '- Screenshot tests failed to run\n' +
              '- The Android code changes don\'t affect UI\n\n' +
              'Check the workflow logs for more details.';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
