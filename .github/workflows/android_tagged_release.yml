name: Android Tagged Release Build

on:
  push:
    tags:
      - 'android-*'
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION_NAME=$(echo ${{ github.ref_name }} | sed 's/android-//')" >> $GITHUB_OUTPUT
          echo "Building version: $(echo ${{ github.ref_name }} | sed 's/android-//')"

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE > keystore_base64.txt
          base64 -d keystore_base64.txt > ${{ runner.temp }}/keystore.jks
          rm keystore_base64.txt

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        
      - name: Build Release AAB
        env:
          DECODED_KEYSTORE_PATH: ${{ runner.temp }}/keystore.jks
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew :app:bundlePlayStoreRelease --stacktrace --no-daemon

      - name: Install Bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar -O ${{ runner.temp }}/bundletool.jar

      - name: Convert AAB to Universal APK
        run: |
          java -jar ${{ runner.temp }}/bundletool.jar build-apks \
            --mode=universal \
            --bundle=./app/build/outputs/bundle/playStoreRelease/app-playStoreRelease.aab \
            --output=${{ runner.temp }}/app-release.apks \
            --ks=${{ runner.temp }}/keystore.jks \
            --ks-pass=pass:${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }} \
            --ks-key-alias=${{ secrets.ANDROID_RELEASE_KEY_ALIAS }} \
            --key-pass=pass:${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          
          unzip ${{ runner.temp }}/app-release.apks -d ${{ runner.temp }}/apks
          cp ${{ runner.temp }}/apks/universal.apk ./app/build/outputs/apk/release/app-release-universal.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackernews-debug-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackernews-aab-${{ github.ref_name }}
          path: android/app/build/outputs/bundle/playStoreRelease/*.aab
          if-no-files-found: error

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hackernews-universal-${{ github.ref_name }}
          path: android/app/build/outputs/apk/release/app-release-universal.apk
          if-no-files-found: error

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > ${{ runner.temp }}/release_notes.md << 'EOF'
          ## 🎉 Hacker News Android Release ${{ github.ref_name }}
          
          ### 📦 What's Included
          
          - **Universal APK**: Works on all Android devices (ARM, x86)
          - **Play Store Bundle (AAB)**: Optimized for Google Play Store
          - **Debug APK**: For testing and development
          
          ### 🔒 Security Improvements
          
          - ✅ Encrypted cookie storage using AES256_GCM
          - ✅ HTTPS-only enforcement via Network Security Config
          - ✅ Comprehensive input validation
          - ✅ URL validation to prevent SSRF attacks
          - ✅ Null safety improvements
          - ✅ Secure backup exclusions
          - ✅ Production debugging disabled
          
          ### 🎨 New Features: Theme Customization
          
          - **6 Preset Themes**: Hacker Orange, Cool Blue, Purple Haze, Forest Green, Ruby Red, Midnight
          - **Font Size Options**: Small, Medium, Large, Extra Large
          - **Corner Style Options**: Boxy, Slightly Rounded, Rounded, Very Rounded
          - **Real-time Preview**: See changes instantly
          - **Persistent Settings**: Preferences saved locally
          - **Dark Mode Support**: All themes work in light and dark modes
          
          ### 📲 Installation
          
          1. Download the **Universal APK** from the assets below
          2. Enable "Install from Unknown Sources" on your device
          3. Install the APK
          4. Open Settings → Appearance → Theme Customization to customize!
          
          ### 🔧 Technical Details
          
          - **Min SDK**: 30 (Android 11)
          - **Target SDK**: 36
          - **Build Tools**: 36.0.0
          - **Kotlin**: 2.3.10
          - **Jetpack Compose**: Latest BOM
          
          ### 📚 Documentation
          
          - [Security Improvements](https://github.com/bsreeram08/hackernews/blob/main/docs/SECURITY.md)
          - [Theme Customization Guide](https://github.com/bsreeram08/hackernews/blob/main/docs/THEME_GUIDE.md)
          
          ---
          
          Built with ❤️ using GitHub Actions
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'Hacker News Android ${{ github.ref_name }}'
          body_path: ${{ runner.temp }}/release_notes.md
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/apk/release/app-release-universal.apk
            android/app/build/outputs/bundle/playStoreRelease/app-playStoreRelease.aab
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on related PRs
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '');
            const message = `✅ Release ${tagName} has been built successfully!\n\n` +
                          `📦 Download the APK from the [Releases page](${context.payload.repository.html_url}/releases/tag/${tagName})`;
            
            // This would ideally find and comment on related PRs
            console.log(message);
